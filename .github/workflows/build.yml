name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --output out .
      - uses: actions/upload-artifact@v7
        with:
          name: ipk
          path: out/*.ipk
  kmods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f Dockerfile.kmods --output out .
      - uses: actions/upload-artifact@v7
        with:
          name: kmods
          path: out/*.ipk
